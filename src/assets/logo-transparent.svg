<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Dynamic Geometric Emblem with Hourglass and Prism Lattice -->
  <defs>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer diamond contour -->
  <polygon points="50,6 94,50 50,94 6,50" stroke="url(#emblemGrad)" stroke-width="4.5" stroke-linejoin="round" fill="none" />
  
  <!-- Inner geometric hourglass triangles -->
  <polygon points="50,14 82,46 18,46" fill="url(#emblemGrad)" opacity="0.95" />
  <polygon points="50,86 18,54 82,54" fill="url(#emblemGrad)" opacity="0.95" />

  <!-- Center focus core prism -->
  <circle cx="50" cy="50" r="4.5" fill="#09090B" stroke="#FFFFFF" stroke-width="2.5" />
</svg>
